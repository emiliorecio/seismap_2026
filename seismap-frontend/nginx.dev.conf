##
## nginx config – DEVELOPMENT mode
## Swagger UI, api-docs and GeoServer Web UI are all proxied and accessible.
##
## Two server blocks share the same locations (see locations.conf):
##  - :80  plain HTTP, for LAN/local access (e.g. host port 3000)
##  - :443 TLS, for the internet-facing DuckDNS domain
##

server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # No access log in development
    access_log off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript;

    include /etc/nginx/locations.conf;
}

server {
    listen 443 ssl;
    server_name _;
    absolute_redirect off;

    # Populated at container start by docker-entrypoint.sh — either a symlink
    # to the real Let's Encrypt cert, or a self-signed fallback for local dev.
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    access_log off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript;

    include /etc/nginx/locations.conf;
}
