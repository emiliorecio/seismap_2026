##
## nginx config – PRODUCTION mode
## Swagger UI, api-docs, GeoServer Web UI, the GeoServer REST admin API and
## the backend's data-loading admin endpoints are blocked (404).
## GeoServer WMS/WFS tiles are still proxied (needed by the map).
##

server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Log all requests to file in production
    access_log /var/log/nginx/access.log combined;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── Dev tools — blocked in production ─────────────────────────────────────
    location = /admin         { return 404; }
    location ^~ /admin/       { return 404; }
    location ^~ /swagger-ui/  { return 404; }
    location ^~ /api-docs/    { return 404; }
    location = /api-docs      { return 404; }

    # ── Backend data-loading admin endpoints — blocked in production ──────────
    # No authentication exists on these yet. Trigger them on the server itself
    # instead, e.g.: docker exec seismap-backend wget -qO- --post-data=''
    # http://localhost:8080/api/admin/import-usgs
    location ^~ /api/admin/ { return 404; }

    # ── GeoServer Web UI — blocked in production ───────────────────────────────
    location = /geoserver       { return 404; }
    location ^~ /geoserver/web/ { return 404; }

    # ── GeoServer REST admin API — blocked in production ───────────────────────
    # Not used by the app's public UI (the backend and GeoServerAutoConfigService
    # call it over the internal Docker network); only WMS/WFS below are needed.
    location ^~ /geoserver/rest/ { return 404; }

    # ── GeoServer WMS/WFS (needed for map tiles) ──────────────────────────────
    location ^~ /geoserver/ {
        proxy_pass http://geoserver:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
