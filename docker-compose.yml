services:
  # PostgreSQL + PostGIS
  postgres:
    image: postgis/postgis:16-3.4
    container_name: seismap-postgres
    environment:
      POSTGRES_DB: seismap
      POSTGRES_USER: ${POSTGRES_USER:-seismap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seismap}
    ports:
      # Bound to loopback only — the backend reaches Postgres over the internal
      # Docker network and never needs this published. Kept for local tools
      # (DBeaver, psql) on the same machine; use an SSH tunnel to reach it on
      # a remote host. Do NOT change this to "5432:5432" on an internet-facing
      # host — that would expose the database directly to the internet.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seismap}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # GeoServer (for WMS/WFS layer rendering)
  geoserver:
    image: kartoza/geoserver:2.28.2
    container_name: seismap-geoserver
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
      GEOSERVER_DATA_DIR: /opt/geoserver/data_dir
      # Disable CSRF check so proxied requests from nginx work
      GEOSERVER_CSRF_WHITELIST: "*"
      # Disable GeoServer's OWS service flood protection
      GEOSERVER_OWS_SERVICE_EXCEPTIONS_MAX_COUNT: "0"
      # Allow many concurrent WMS requests
      JAVA_OPTS: >-
        -Xms256m -Xmx1g
        -DGEOSERVER_CSRF_DISABLED=true
        -Dorg.geowebcache.default.max.concurrent.connections=32
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
      - ./controlflow.properties:/opt/geoserver/data_dir/controlflow.properties
    depends_on:
      postgres:
        condition: service_healthy

  # Spring Boot Backend
  backend:
    build:
      context: ./seismap-backend
      dockerfile: Dockerfile
    container_name: seismap-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/seismap
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-seismap}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-seismap}
      SEISMAP_GEOSERVER_URL: http://geoserver:8080/geoserver
      SEISMAP_GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      SEISMAP_GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
      SEISMAP_DATA_FILES_DIRECTORY: /app/data
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-production}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # React Frontend (served by Nginx)
  frontend:
    build:
      context: ./seismap-frontend
      dockerfile: Dockerfile
      args:
        APP_PROFILE: ${APP_PROFILE:-production}
    container_name: seismap-frontend
    environment:
      APP_PROFILE: ${APP_PROFILE:-production}
    ports:
      - "3000:80"
      # HTTPS for the internet-facing DuckDNS domain. Certs are issued/renewed
      # on the host via certbot (DNS-01 through the DuckDNS API — see
      # README.md#https-tls) and bind-mounted in read-only.
      - "3443:443"
    volumes:
      - /var/log/nginx:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  geoserver_data:
